<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Reset Password — OpenDataBD</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
tailwind.config = {
  darkMode:"class",
  theme:{extend:{
    colors:{
      "background":"#f7f9fb","on-surface":"#191c1e","on-secondary":"#ffffff",
      "secondary-container":"#e21e49","secondary":"#ba0035",
      "surface-container-lowest":"#ffffff","surface-container-low":"#f2f4f6",
      "surface-container":"#eceef0","on-surface-variant":"#45464d",
      "outline-variant":"#c6c6cd","outline":"#76777d",
      "error-container":"#ffdad6","on-error-container":"#93000a",
      "tertiary-fixed":"#89f5e7","on-tertiary-fixed":"#002020",
      "primary-container":"#131b2e","inverse-surface":"#2d3133","surface-dim":"#d8dadc",
    },
    spacing:{
      "margin-desktop":"64px","unit-lg":"32px","container-max":"1280px",
      "unit-xs":"4px","unit-xl":"64px","gutter":"24px","unit-sm":"8px","unit-md":"16px","margin-mobile":"20px"
    },
    fontFamily:{"body-md":["Inter"],"headline-lg":["Hanken Grotesk"],"headline-md":["Hanken Grotesk"]},
    fontSize:{
      "body-md":["16px",{lineHeight:"1.5",fontWeight:"400"}],
      "headline-lg":["32px",{lineHeight:"1.2",letterSpacing:"-0.01em",fontWeight:"700"}],
      "headline-md":["24px",{lineHeight:"1.3",fontWeight:"600"}]
    }
  }}
}
</script>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
</style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col">

<!-- Nav -->
<nav class="w-full bg-surface-container-lowest border-b border-outline-variant/30 shadow-sm">
  <div class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop flex items-center h-20">
    <a href="/" class="font-bold text-base bg-secondary text-on-secondary px-unit-md py-unit-sm rounded-lg hover:bg-secondary-container transition-colors duration-200 shadow-sm">OpenDataBD</a>
  </div>
</nav>

<!-- Main -->
<main class="flex-1 flex items-center justify-center px-margin-mobile py-unit-xl">
  <div class="w-full max-w-md">

    <!-- Card -->
    <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant/30 shadow-lg overflow-hidden">
      <div class="px-8 pt-8 pb-8">

        <div class="mb-6">
          <span class="font-bold text-base bg-secondary text-on-secondary px-3 py-1 rounded-lg">OpenDataBD</span>
        </div>

        <!-- Message banner -->
        <div id="msg" class="hidden text-sm px-4 py-3 rounded-xl mb-5"></div>

        <!-- New password form -->
        <div id="form-section">
          <h1 class="font-headline-md text-headline-md mb-1">Set a new password</h1>
          <p class="text-sm text-on-surface-variant mb-6">Must be at least 8 characters.</p>

          <form id="reset-form" class="space-y-4" novalidate>
            <div>
              <label class="text-sm font-medium text-on-surface-variant block mb-1.5">New password</label>
              <input id="new-password" type="password" placeholder="Min. 8 characters"
                autocomplete="new-password" required minlength="8"
                class="w-full px-4 py-3 rounded-xl border border-outline-variant bg-surface-container-low text-on-surface text-sm placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary/40 focus:border-secondary transition-colors" />
            </div>
            <div>
              <label class="text-sm font-medium text-on-surface-variant block mb-1.5">Confirm password</label>
              <input id="confirm-password" type="password" placeholder="Repeat password"
                autocomplete="new-password" required minlength="8"
                class="w-full px-4 py-3 rounded-xl border border-outline-variant bg-surface-container-low text-on-surface text-sm placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary/40 focus:border-secondary transition-colors" />
            </div>
            <button type="submit"
              class="w-full bg-secondary text-on-secondary py-3 rounded-xl font-semibold text-sm hover:bg-secondary-container transition-colors duration-200 active:scale-95 flex items-center justify-center gap-2">
              <span id="btn-text">Update Password</span>
              <svg id="spinner" class="hidden animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
              </svg>
            </button>
          </form>
        </div>

        <!-- Success state -->
        <div id="success-section" class="hidden text-center py-4">
          <span class="material-symbols-outlined text-5xl text-secondary mb-3 block"
            style="font-variation-settings:'FILL' 1;">check_circle</span>
          <h2 class="font-headline-md text-headline-md mb-2">Password updated!</h2>
          <p class="text-sm text-on-surface-variant mb-6">You can now sign in with your new password.</p>
          <a href="/" class="inline-block bg-secondary text-on-secondary px-6 py-3 rounded-xl font-semibold text-sm hover:bg-secondary-container transition-colors duration-200">
            Go to homepage →
          </a>
        </div>

        <!-- Invalid / expired link state -->
        <div id="invalid-section" class="hidden text-center py-4">
          <span class="material-symbols-outlined text-5xl text-outline mb-3 block">link_off</span>
          <h2 class="font-headline-md text-headline-md mb-2">Link expired or invalid</h2>
          <p class="text-sm text-on-surface-variant mb-6">Password reset links expire after 1 hour. Request a new one.</p>
          <a href="/" class="inline-block bg-secondary text-on-secondary px-6 py-3 rounded-xl font-semibold text-sm hover:bg-secondary-container transition-colors duration-200">
            Back to homepage
          </a>
        </div>

      </div>
    </div>

  </div>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const msgEl      = document.getElementById('msg');
const formSec    = document.getElementById('form-section');
const successSec = document.getElementById('success-section');
const invalidSec = document.getElementById('invalid-section');

function showMsg(text, type = 'error') {
  msgEl.textContent = text;
  msgEl.className = `text-sm px-4 py-3 rounded-xl mb-5 ${
    type === 'success'
      ? 'bg-tertiary-fixed text-on-tertiary-fixed'
      : 'bg-error-container text-on-error-container'
  }`;
  msgEl.classList.remove('hidden');
}

// ── Initialise Supabase client from /api/config ───────────────────────────────
let supabase;
async function init() {
  try {
    const cfg = await fetch('/api/config').then(r => r.json());
    supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

    // Supabase embeds the recovery token in the URL hash (#access_token=...&type=recovery)
    // Calling getSession after page load will automatically exchange it for a session.
    const { data: { session }, error } = await supabase.auth.getSession();

    if (error || !session) {
      formSec.classList.add('hidden');
      invalidSec.classList.remove('hidden');
      return;
    }
  } catch {
    formSec.classList.add('hidden');
    invalidSec.classList.remove('hidden');
  }
}

init();

// ── Form submit ───────────────────────────────────────────────────────────────
document.getElementById('reset-form').onsubmit = async e => {
  e.preventDefault();
  const pw  = document.getElementById('new-password').value;
  const pw2 = document.getElementById('confirm-password').value;

  if (pw.length < 8) { showMsg('Password must be at least 8 characters.'); return; }
  if (pw !== pw2)    { showMsg('Passwords do not match.'); return; }

  const btnText = document.getElementById('btn-text');
  const spinner = document.getElementById('spinner');
  btnText.textContent = 'Updating…';
  spinner.classList.remove('hidden');

  const { error } = await supabase.auth.updateUser({ password: pw });

  btnText.textContent = 'Update Password';
  spinner.classList.add('hidden');

  if (error) {
    showMsg(error.message);
    return;
  }

  formSec.classList.add('hidden');
  successSec.classList.remove('hidden');
  msgEl.classList.add('hidden');
};
</script>

</body>
</html>
