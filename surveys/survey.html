<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OpenDataBD Survey</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 900px; }
    h1 { margin-bottom: 6px; }
    .muted { color:#555; margin-top:0; }
    .card { border:1px solid #ddd; border-radius:10px; padding:16px; margin:14px 0; }
    label { font-weight: 600; display:block; margin-bottom:6px; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%; padding: 10px; border:1px solid #ccc; border-radius:8px;
    }
    textarea { min-height: 90px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    .row > * { flex: 1 1 280px; }
    .btn {
      padding: 10px 14px; border:1px solid #111; background:#fff; cursor:pointer;
      border-radius:8px; font-weight:600;
    }
    .btn.primary { background:#111; color:#fff; }
    .status { margin-top:10px; font-size: 14px; }
    .status.ok { color: #0a7a2f; }
    .status.err { color: #b00020; }
    .q { margin-top: 10px; }
    .choices { display:grid; gap:8px; }
    .choices label { font-weight: 400; display:flex; gap:8px; align-items:center; margin:0; }
    .disabled { opacity: .5; pointer-events:none; }
    .req { color:#b00020; font-weight:700; margin-left:6px; }
  </style>
</head>
<body>
  <h1>OpenDataBD Survey</h1>
  <p class="muted">Enter your access code to begin.</p>

  <div class="card">
    <div class="row">
      <div>
        <label for="accessCode">Access Code <span class="req">*</span></label>
        <input id="accessCode" type="text" placeholder="e.g., AB12CD34" autocomplete="off" />
      </div>
      <div style="display:flex; align-items:flex-end; gap:10px;">
        <button class="btn primary" id="btnValidate" type="button">Validate Code</button>
      </div>
    </div>
    <div id="codeStatus" class="status"></div>
  </div>

  <form id="surveyForm" class="disabled">
    <div id="questions"></div>

    <div class="card">
      <button class="btn primary" type="submit">Submit Survey</button>
      <div id="submitStatus" class="status"></div>
    </div>
  </form>

  <script>
    // 1) PASTE your Apps Script Web App URL here:
    // Example: https://script.google.com/macros/s/XXXX/exec
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz67BdVjBhK9nAkfFaptucssnp3ehb0eG4xgvfsf9X4ZbcSsQxTw55Qg--Q-Xogd7A/exec';

    // 2) Define your questions here (edit texts/options anytime)
    const QUESTIONS = [
      { id:"q1",  type:"text",     label:"1) What is your full name?", required:false },
      { id:"q2",  type:"text",     label:"2) What city/district are you in?", required:true },
      { id:"q3",  type:"select",   label:"3) Your age group?", required:true, options:["18–24","25–34","35–44","45–54","55+"] },
      { id:"q4",  type:"radio",    label:"4) Your gender?", required:false, options:["Female","Male","Non-binary","Prefer not to say"] },
      { id:"q5",  type:"radio",    label:"5) Are you currently employed?", required:true, options:["Yes","No","Student","Other"] },
      { id:"q6",  type:"number",   label:"6) Household size (number of people)?", required:true, min:1, max:30 },
      { id:"q7",  type:"radio",    label:"7) Do you have reliable internet access?", required:true, options:["Yes","No","Sometimes"] },
      { id:"q8",  type:"rating",   label:"8) Rate public service quality in your area (1=low, 5=high).", required:true, scale:5 },
      { id:"q9",  type:"checkbox", label:"9) Which topics interest you most? (Select all that apply)", required:true,
        options:["Economy","Education","Health","Environment","Transport","Governance","Crime/Safety"] },
      { id:"q10", type:"textarea", label:"10) What is the biggest challenge in your community?", required:true },

      { id:"q11", type:"radio",    label:"11) How often do you use public transportation?", required:true,
        options:["Daily","Weekly","Monthly","Rarely","Never"] },
      { id:"q12", type:"radio",    label:"12) Do you feel safe in your neighborhood at night?", required:true,
        options:["Yes","No","Sometimes"] },
      { id:"q13", type:"rating",   label:"13) Rate access to healthcare (1–5).", required:true, scale:5 },
      { id:"q14", type:"rating",   label:"14) Rate quality of education services (1–5).", required:true, scale:5 },
      { id:"q15", type:"radio",    label:"15) Do you think government data should be openly available?", required:true,
        options:["Yes","No","Not sure"] },

      { id:"q16", type:"checkbox", label:"16) Which data would you use if available? (Select all that apply)", required:false,
        options:["Budget/Spending","Elections","Health","Prices/Inflation","Climate/Disaster","Jobs/Employment"] },
      { id:"q17", type:"textarea", label:"17) What dataset would you want OpenDataBD to publish first?", required:true },
      { id:"q18", type:"radio",    label:"18) Would you participate in future surveys?", required:true,
        options:["Yes","No","Maybe"] },
      { id:"q19", type:"radio",    label:"19) Do you want email updates from OpenDataBD?", required:false,
        options:["Yes","No"] },
      { id:"q20", type:"textarea", label:"20) Any additional comments or suggestions?", required:false },
    ];

    let codeValidated = false;

    function el(tag, attrs={}, children=[]) {
      const n = document.createElement(tag);
      Object.entries(attrs).forEach(([k,v]) => {
        if (k === "class") n.className = v;
        else if (k === "html") n.innerHTML = v;
        else n.setAttribute(k, v);
      });
      (Array.isArray(children) ? children : [children]).forEach(c => {
        if (c === null || c === undefined) return;
        if (typeof c === "string") n.appendChild(document.createTextNode(c));
        else n.appendChild(c);
      });
      return n;
    }

    function renderQuestions() {
      const host = document.getElementById("questions");
      host.innerHTML = "";
      QUESTIONS.forEach(q => {
        const card = el("div", { class:"card q" });

        const label = el("label", { for:q.id }, [
          q.label,
          q.required ? el("span", { class:"req" }, " *") : null
        ]);
        card.appendChild(label);

        let inputBlock;

        if (q.type === "text") {
          inputBlock = el("input", { id:q.id, type:"text", "data-qid":q.id });
        } else if (q.type === "number") {
          inputBlock = el("input", { id:q.id, type:"number", min:q.min ?? "", max:q.max ?? "", "data-qid":q.id });
        } else if (q.type === "textarea") {
          inputBlock = el("textarea", { id:q.id, "data-qid":q.id });
        } else if (q.type === "select") {
          const sel = el("select", { id:q.id, "data-qid":q.id });
          sel.appendChild(el("option", { value:"" }, "Select..."));
          q.options.forEach(opt => sel.appendChild(el("option", { value:opt }, opt)));
          inputBlock = sel;
        } else if (q.type === "radio") {
          const wrap = el("div", { class:"choices" });
          q.options.forEach((opt, idx) => {
            const rid = `${q.id}_${idx}`;
            const inp = el("input", { type:"radio", name:q.id, id:rid, value:opt, "data-qid":q.id });
            const lab = el("label", { for:rid }, [inp, opt]);
            wrap.appendChild(lab);
          });
          inputBlock = wrap;
        } else if (q.type === "checkbox") {
          const wrap = el("div", { class:"choices" });
          q.options.forEach((opt, idx) => {
            const cid = `${q.id}_${idx}`;
            const inp = el("input", { type:"checkbox", id:cid, value:opt, "data-qid":q.id });
            const lab = el("label", { for:cid }, [inp, opt]);
            wrap.appendChild(lab);
          });
          inputBlock = wrap;
        } else if (q.type === "rating") {
          const wrap = el("div", { class:"choices" });
          for (let i=1; i<=q.scale; i++) {
            const rid = `${q.id}_${i}`;
            const inp = el("input", { type:"radio", name:q.id, id:rid, value:String(i), "data-qid":q.id });
            const lab = el("label", { for:rid }, [inp, ` ${i}`]);
            wrap.appendChild(lab);
          }
          inputBlock = wrap;
        }

        card.appendChild(inputBlock);
        host.appendChild(card);
      });
    }

    function getAnswers() {
      const answers = {};
      for (const q of QUESTIONS) {
        if (q.type === "radio" || q.type === "rating") {
          const checked = document.querySelector(`input[name="${q.id}"]:checked`);
          answers[q.id] = checked ? checked.value : "";
        } else if (q.type === "checkbox") {
          const checked = Array.from(document.querySelectorAll(`input[data-qid="${q.id}"]:checked`))
            .map(x => x.value);
          answers[q.id] = checked;
        } else {
          const node = document.querySelector(`[data-qid="${q.id}"]`);
          answers[q.id] = node ? (node.value ?? "").trim() : "";
        }
      }
      return answers;
    }

    function validateRequired(answers) {
      const missing = [];
      for (const q of QUESTIONS) {
        if (!q.required) continue;
        const v = answers[q.id];
        const ok = Array.isArray(v) ? v.length > 0 : String(v).trim().length > 0;
        if (!ok) missing.push(q.label);
      }
      return missing;
    }

    async function postJSON(payload) {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify(payload),
      });
      return res.json();
    }

    async function validateCode() {
      const code = document.getElementById("accessCode").value.trim();
      const status = document.getElementById("codeStatus");
      status.className = "status";
      status.textContent = "";

      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR_WEB_APP_URL_HERE")) {
        status.className = "status err";
        status.textContent = "Missing APPS_SCRIPT_URL. Paste your Apps Script Web App URL at the top of this file.";
        return;
      }

      if (!code) {
        status.className = "status err";
        status.textContent = "Please enter your access code.";
        return;
      }

      status.textContent = "Validating code...";

      // This expects your Apps Script to support action=validateCode (POST)
      const result = await postJSON({ action:"validateCode", code });

      if (result && result.valid) {
        codeValidated = true;
        status.className = "status ok";
        status.textContent = "Code accepted. You may start the survey.";
        document.getElementById("surveyForm").classList.remove("disabled");
      } else {
        status.className = "status err";
        status.textContent = (result && result.message) ? result.message : "Invalid code.";
        document.getElementById("surveyForm").classList.add("disabled");
        codeValidated = false;
      }
    }

    document.getElementById("btnValidate").addEventListener("click", validateCode);

    document.getElementById("surveyForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitStatus = document.getElementById("submitStatus");
      submitStatus.className = "status";
      submitStatus.textContent = "";

      if (!codeValidated) {
        submitStatus.className = "status err";
        submitStatus.textContent = "Please validate your code first.";
        return;
      }

      const code = document.getElementById("accessCode").value.trim();
      const answers = getAnswers();
      const missing = validateRequired(answers);

      if (missing.length) {
        submitStatus.className = "status err";
        submitStatus.textContent = "Missing required answers. Please complete the required questions.";
        return;
      }

      submitStatus.textContent = "Submitting...";

      // This expects your Apps Script to accept {code, answers} and save it
      const result = await postJSON({ code, answers });

      if (result && (result.success === true || result.ok === true)) {
        submitStatus.className = "status ok";
        submitStatus.textContent = "Submitted successfully. Thank you!";
        e.target.reset();
        document.getElementById("surveyForm").classList.add("disabled");
        codeValidated = false;
      } else {
        submitStatus.className = "status err";
        submitStatus.textContent = (result && result.message) ? result.message : "Submission failed.";
      }
    });

    renderQuestions();
  </script>
</body>
</html>
